<!doctype html>
<html lang="en" data-skin="xair">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIRCORE</title>
  <link rel="stylesheet" href="./xair.css">
  <link rel="stylesheet" href="./skin-menu.css">
</head>
<body>
  <div id="skin-root">
    <header class="toolbar" id="toolbar">
      <div id="window-drag" class="window-drag"></div>
      <button id="window-minimize" type="button" aria-label="Minimize">−</button>
      <button id="window-maximize" type="button" aria-label="Maximize">□</button>
      <button id="window-close" type="button" aria-label="Close window">×</button>
    </header>
    <div class="xair-board">
      <nav class="xair-tabs" aria-label="Mixer">
        <button type="button" data-mixer-action="mixer" aria-pressed="true"><span aria-hidden="true">▥</span> Mixer</button>
        <button type="button" data-mixer-action="channel" disabled><span aria-hidden="true">☷</span> Channel</button>
        <button type="button" data-mixer-action="input" disabled><span aria-hidden="true">⇥</span> Input</button>
        <button type="button" data-mixer-action="effects" disabled><span aria-hidden="true">∿</span> FX</button>
        <button type="button" data-mixer-action="sends" disabled><span aria-hidden="true">⇉</span> Sends</button>
        <button type="button" data-mixer-action="meters" aria-pressed="false"><span aria-hidden="true">▥</span> Meters</button>
      </nav>
      <main id="xair-mixer-viewport">
        <div id="channels" aria-label="Channels"></div>
        <p id="xair-empty" hidden>No channels</p>
      </main>
      <aside class="xair-side" aria-label="Audcore">
        <button id="system-menu" class="brand" type="button" aria-label="Project menu"><i>AIRCORE</i></button>
        <div id="xair-sidebar-status">
          <output id="audio-status" aria-live="polite"></output>
        </div>
        <div class="xair-selection" aria-label="Current channel" aria-live="polite">
          <span id="xair-selection-number">—</span>
          <span id="xair-selection-name">No channel</span>
        </div>
        <div class="xair-tools">
          <button id="settings" type="button">Settings</button>
          <button id="channel-list" type="button" aria-label="Channel list">☷</button>
          <button id="add-channel" type="button" aria-label="Add channel">＋</button>
          <button id="transport" type="button" disabled>▶</button>
          <button id="xair-save" type="button" data-label="保存预设">Save</button>
          <button id="xair-open" type="button" data-label="打开文件">Open</button>
        </div>
        <div class="xair-routing">
          <button type="button" data-mixer-action="solo" data-label="独奏" disabled>Solo</button>
          <h2 id="xair-routing-title" hidden>Out</h2>
          <div id="xair-routing"></div>
        </div>
      </aside>
    </div>
    <div id="status" role="status" aria-live="polite"></div>
  </div>
  <div class="resize-area" data-resize="north" aria-hidden="true"></div>
  <div class="resize-area" data-resize="south" aria-hidden="true"></div>
  <div class="resize-area" data-resize="east" aria-hidden="true"></div>
  <div class="resize-area" data-resize="west" aria-hidden="true"></div>
  <div class="resize-area" data-resize="northEast" aria-hidden="true"></div>
  <div class="resize-area" data-resize="northWest" aria-hidden="true"></div>
  <div class="resize-area" data-resize="southEast" aria-hidden="true"></div>
  <div class="resize-area" data-resize="southWest" aria-hidden="true"></div>
  <script type="module" src="./page.mjs"></script>
</body>
</html>
